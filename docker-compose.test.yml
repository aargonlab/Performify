name: performify-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: performify_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      target: deps
    working_dir: /app
    command: sh -c "npx prisma db push --skip-generate --accept-data-loss && npx prisma generate && npm run test"
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@postgres-test:5432/performify_test
      REDIS_URL: redis://redis-test:6379
      # Deterministic secrets for webhook HMAC integration tests
      SHOPIFY_API_KEY: test-api-key
      SHOPIFY_API_SECRET: test-api-secret
      SHOPIFY_APP_URL: https://test-app.example.com
      SCOPES: read_content,read_locales,read_markets,read_products,read_themes
      PSI_API_KEY: test-psi-key
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
